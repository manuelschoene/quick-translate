version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Manuel Schöne"
  productName: "Quick Translate"
  description: "Translate your selected text anywhere"
  copyright: "Copyright © 2026 Manuel Schöne"
  comments: "Translate your selected text anywhere"
  version: "0.1.0-alpha"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

other:
  # The author
  - name: "Manuel Schöne"
    email: "schoene-manuel@gmx.de"
