name: Continuous Integration
on:
  push:
    branches:
      [main, "chore/**", "docs/**", "feature/**", "hotfix/**", "refactor/**", "test/**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint and format code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The event is part of the group: a push and the pull request of the same branch share a head ref, so
    # without it the pull request run cancels the push run, which then shows up as a failed check.
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # Every step below fixes rather than checks, and none of them may fail the job: this job is a
      # courtesy for a contributor who forgot to run the formatters, not a gate. The test job checks.
      - name: Run gofmt
        shell: bash
        continue-on-error: true
        run: gofmt -s -w .

      - name: Run ESLint
        uses: ./.github/actions/run-eslint
        continue-on-error: true
        with:
          write: "true"

      - name: Run Prettier
        uses: ./.github/actions/run-prettier
        continue-on-error: true
        with:
          write: "true"

      # Three cases where the push would fail rather than help, so it is skipped and the job stays green:
      # 'main' is protected and everything on it came through a reviewed pull request already, a tag ref
      # cannot be pushed to at all (the release workflow calls this one on a tag), and a pull request from a
      # fork hands this workflow a read-only token. In all three the test job still reports what is
      # unformatted, and the contributor fixes it manually.
      #
      # Only this step is guarded, not the job: the test job needs it, and a skipped job would skip the
      # tests along with it.
      - name: Commit changes
        if: >-
          github.ref_name != 'main' &&
          github.ref_type != 'tag' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        continue-on-error: true
        with:
          branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          commit_message: "style: Linted and formatted code (auto-committed)"
          commit_options: "--no-verify"

  test:
    name: Run tests and static analysis
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      # Checked out by branch rather than by SHA, so this picks up whatever the lint job committed.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # --- Frontend --------------------------------------------------------------------------------------

      - name: Run TypeScript
        working-directory: frontend
        run: bun run types

      - name: Run ESLint
        uses: ./.github/actions/run-eslint
        with:
          write: "false"

      - name: Run Prettier
        uses: ./.github/actions/run-prettier
        with:
          write: "false"

      # The frontend must be built first, because the assets are embedded into the Go binary.
      - name: Check the frontend build
        working-directory: frontend
        run: bun run build

      # --- Go ----------------------------------------------------------------------------------------------

      - name: Setup Wails
        uses: ./.github/actions/setup-wails
        with:
          desktop-file-utils: "true"

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::error::These files are not gofmt-clean. Run 'gofmt -s -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./...

      - name: Verify module dependencies
        shell: bash
        run: |
          go mod verify
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::'go mod tidy' changed go.mod or go.sum. Run it and commit the result."
            exit 1
          fi

      - name: Scan dependencies for known vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Same archive as the release ships, without UPX compression to save time.
      - name: Build the archive
        run: wails3 task archive UPX=false

      # Bindings must be committed for the frontend checks to pass.
      - name: Check the generated bindings are current
        shell: bash
        run: |
          changes=$(git status --porcelain -- frontend/bindings)
          if [[ -n "$changes" ]]; then
            echo "::error::The generated bindings are out of date. Run 'wails3 task common:generate:bindings' and commit frontend/bindings."
            echo "$changes"
            git --no-pager diff -- frontend/bindings
            exit 1
          fi

      # Sandbox the binary in a temporary home directory, so failures do not touch the real one.
      - name: Smoke-test the command line
        shell: bash
        run: |
          home=$(mktemp -d)
          export XDG_DATA_HOME="$home/data" XDG_CONFIG_HOME="$home/config" XDG_CACHE_HOME="$home/cache"

          ./bin/quick-translate --version
          ./bin/quick-translate --help
          ./bin/quick-translate --status
