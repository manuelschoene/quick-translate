name: Release
on:
    push:
        branches: [main]
    # Rebuilds and re-attaches the assets of a release that already exists, for when the build failed after
    # release-please had already tagged it. release-please itself is skipped on this path, so a manual run
    # can never create or move a release, it only fills one in.
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag to rebuild the assets for, e.g. v0.1.0-alpha"
                required: true
                type: string

permissions:
    contents: write
    pull-requests: write

jobs:
    # Runs on every push to main and does one of two things: keep the release pull request up to date with
    # the conventional commits that have landed, or, once that pull request is merged, tag the release and
    # create it. Only the second case sets 'release_created', which is what gates everything below.
    release-please:
        name: Prepare the release
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v4

    # The single place that answers "what is being built", so nothing below has to know which trigger it
    # was started from. Runs when release-please has just created a release, or on a manual rebuild, and in
    # neither case does it touch the release itself.
    resolve:
        name: Resolve the release
        needs: release-please
        if: >-
            !cancelled() &&
            (github.event_name == 'workflow_dispatch' ||
             needs.release-please.outputs.created == 'true')
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.pick.outputs.tag }}
            version: ${{ steps.pick.outputs.version }}

        steps:
            # The version is the tag without the leading 'v', the same split the rest of the pipeline
            # relies on, and the reason a manual run only needs the tag.
            - name: Pick the tag and the version
              id: pick
              shell: bash
              env:
                  DISPATCH_TAG: ${{ inputs.tag }}
                  RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
                  RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
              run: |
                  if [[ -n "$DISPATCH_TAG" ]]; then
                    tag=$DISPATCH_TAG
                    version=${tag#v}
                  else
                    tag=$RELEASE_TAG
                    version=$RELEASE_VERSION
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "Building $version for release $tag"

            - name: Confirm the release exists
              if: github.event_name == 'workflow_dispatch'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.pick.outputs.tag }}
              run: |
                  if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                    echo "::error::There is no release for tag '$TAG'. Check 'gh release list'."
                    exit 1
                  fi

    # Nothing is published from a tree that does not pass. Merging the release pull request runs the CI
    # workflow on its own as a push to main, so this repeats it once per release, worth it for the
    # guarantee that the artefacts and the checks come from the same commit. Skipped on a manual rebuild:
    # that tree passed when it was released, and re-running the checks against an old tag can fail for
    # reasons that have nothing to do with the assets, such as a vulnerability published since.
    verify:
        name: Verify
        needs: resolve
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: write

    build:
        name: Build the archive
        needs: [resolve, verify]
        if: >-
            !cancelled() &&
            needs.resolve.result == 'success' &&
            needs.verify.result != 'failure'
        # The oldest runner that ships GTK 4.10. Requires glibc 2.39, which is shipped on distributions with GTK 4.10 anyway.
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout the release
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.resolve.outputs.tag }} # Tag created by release-please, or the one given to a manual run.

            - name: Setup Bun
              uses: ./.github/actions/setup-bun

            - name: Setup Go
              uses: ./.github/actions/setup-go

            - name: Setup Wails
              uses: ./.github/actions/setup-wails
              with:
                  upx: "true"

            # Check to prevent a release-please misconfiguration from shipping the wrong version, and to make sure the
            # extra-files updater is still working after a change to the release-please config.
            - name: Check build/config.yml against the release
              shell: bash
              env:
                  RELEASED: ${{ needs.resolve.outputs.version }}
              run: |
                  declared=$(sed -n 's/^  version: *"\(.*\)".*/\1/p' build/config.yml)
                  if [[ "$declared" != "$RELEASED" ]]; then
                    echo "::error::build/config.yml says '$declared' but the release is '$RELEASED'. Check the extra-files updater in release-please-config.json."
                    exit 1
                  fi

            - name: Build the archive
              run: wails3 task archive

            - name: Upload the archive
              uses: actions/upload-artifact@v7
              with:
                  name: archive
                  path: bin/*.tar.gz
                  if-no-files-found: error

    publish:
        name: Publish the release assets
        needs: [resolve, build]
        if: >-
            !cancelled() &&
            needs.resolve.result == 'success' &&
            needs.build.result == 'success'
        runs-on: ubuntu-latest

        steps:
            - name: Download the archive
              uses: actions/download-artifact@v8
              with:
                  name: archive
                  path: dist

            # One file over every archive rather than one beside each, so a reader can verify everything the
            # release ships with a single 'sha256sum --check'.
            - name: Generate the checksums
              shell: bash
              working-directory: dist
              run: |
                  sha256sum *.tar.gz | tee SHA256SUMS

            - name: Attach everything to the release
              shell: bash
              working-directory: dist
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.resolve.outputs.tag }}
              run: gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
