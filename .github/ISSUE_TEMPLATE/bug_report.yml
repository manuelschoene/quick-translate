name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! The desktop integration and the clipboard behave differently on almost every setup, so the
        details below are what make a report reproducible.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did the application do instead of working?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: Leave this out if it is obvious from the above.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in …
        2. Press Shortcut
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Output of `quick-translate --version`
      description: Which build this is. Please say so even when you built it yourself.
      placeholder: Quick Translate 0.1.0-alpha
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `quick-translate --status`
      description: Shows what is installed where.
      render: text
    validations:
      required: true

  - type: textarea
    id: journal
    attributes:
      label: Log output
      description: |
        If it was started with your session:
        `journalctl --user -u 'app-io.github.manuelschoene.QuickTranslate@autostart.service' -n 50`.
        Please remove anything private before pasting.
      render: text
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it
      options:
        - Release archive
        - Built from source (task archive)
        - Other
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Distribution and version
      placeholder: Fedora 42, Ubuntu 24.04, Arch (rolling), …
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment and version
      placeholder: KDE Plasma 6.7, GNOME 50, sway 1.12, …
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: The value of `echo $XDG_SESSION_TYPE`.
      options:
        - Wayland
        - X11
        - I do not know
    validations:
      required: true

  - type: dropdown
    id: clipboard
    attributes:
      label: Which clipboard tools are installed
      description: Check with `command -v wl-paste xclip xsel`. Pick all that apply.
      multiple: true
      options:
        - wl-clipboard
        - xclip
        - xsel
        - None of them
        - I do not know
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not one of them.
          required: true
        - label: I am on the latest release, or on a recent state of `main`.
          required: false
